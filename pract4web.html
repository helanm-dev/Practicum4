<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Styles and Layouts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .container {
            width: 220px;
            margin: auto;
            padding: 15px;
            background-color: #f5f5f5;
        }

        h2 {
            font-size: 18px;
            color: #222;
            margin-top: 0;
        }

        hr {
            border: 0;
            border-top: 1px solid #ccc;
        }

        h3 {
            font-size: 14px;
            margin-bottom: 8px;
        }

        p {
            font-size: 11px;
            line-height: 1.5;
            color: #333;
        }

        .layout {
            display: flex;
            gap: 8px;
        }

        .box {
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 10px;
            flex: 1;
        }

        .box h3 {
            margin-top: 0;
        }

        .box p {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>CSS Text Styles and Layouts</h2>

        <hr>

        <h3>Simple Web Layout Using CSS</h3>

        <p>
            This is a simple example of a web layout
            using various CSS text styles.
        </p>

        <div class="layout">

            <div class="box">
                <h3>Sidebar</h3>
                <p>
                    <i>
                        Lorem ipsum dolor sit amet,
                        consectetur adipiscing elit.
                    </i>
                </p>
            </div>

            <div class="box">
                <h3>Main Content</h3>
                <p>
                    SED DO EIUSMOD TEMPOR INCIDIDUNT
                    UT LABORE ET DOLORE MAGNA ALIQUA.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
